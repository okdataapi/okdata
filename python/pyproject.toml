[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "okdata"
dynamic = ["version"]
description = "Python SDK for okdata: Douyin, Xiaohongshu, WeChat, Bilibili, Weibo, TikTok, X and YouTube data for AI agents, paid per call."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "okdata", email = "hello@okdata.online" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.25,<1"]
keywords = [
  "okdata", "social media api", "social data", "ai agents", "mcp", "douyin api", "xiaohongshu api", "rednote api",
  "wechat api", "bilibili api", "weibo api", "tiktok api", "twitter api", "x api", "youtube transcript", "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://okdata.online"
Documentation = "https://okdata.online/docs/"
Endpoints = "https://okdata.online/apis/"
Pricing = "https://okdata.online/pricing/"
Source = "https://github.com/okdataapi/okdata"
Issues = "https://github.com/okdataapi/okdata/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[tool.hatch.version]
path = "src/okdata/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/okdata"]

[tool.hatch.build.targets.sdist]
include = ["src/okdata", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
