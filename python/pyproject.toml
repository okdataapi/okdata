[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "okdata"
dynamic = ["version"]
description = "Python SDK for okdata, the social data API and MCP server for AI agents: TikTok, RedNote (Xiaohongshu), Douyin, WeChat, X, YouTube, Bilibili, Weibo and more, paid per call. Typed methods per endpoint, sync and async, safe retries, paging with a spend limit."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "okdata", email = "hello@okdata.online" }]
requires-python = ">=3.9"
dependencies = ["httpx>=0.25,<1"]
keywords = [
  "okdata", "sdk", "social media api", "social data", "ai agents", "mcp", "douyin", "xiaohongshu", "rednote",
  "wechat", "bilibili", "weibo", "tiktok", "twitter", "x", "youtube", "instagram", "reddit",
  "kuaishou", "douyin api", "xiaohongshu api", "tiktok api", "xingtu", "wechat official account",
  "mcp server", "claude", "cursor", "social media data",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://okdata.online/"
"MCP server" = "https://okdata.online/mcp/"
"中文" = "https://okdata.online/zh/"
Documentation = "https://okdata.online/docs/sdk/"
Endpoints = "https://okdata.online/apis/"
Pricing = "https://okdata.online/pricing/"
Source = "https://github.com/okdataapi/okdata/tree/main/python"
Issues = "https://github.com/okdataapi/okdata/issues"

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "mypy>=1.8"]

[tool.hatch.version]
path = "src/okdata/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/okdata"]
# src/okdata/_generated is generated from the okdata catalog (git-ignored in the monorepo, committed in
# the public repo); ship it either way.
artifacts = ["src/okdata/_generated/*.py"]

[tool.hatch.build.targets.sdist]
# Anchored ("/tests", not "tests"), so a virtualenv or any other folder in here never ships.
include = ["/src/okdata", "/tests", "/README.md", "/LICENSE"]
artifacts = ["src/okdata/_generated/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
# Runs on the interpreter at hand (mypy no longer targets 3.9); 3.9 itself is covered by running the tests on it.
strict = true
files = ["src/okdata", "tests/typing_check.py"]
