name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    name: typescript + cli (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      # @okdata/sdk
      - run: npm run typecheck -w typescript
      - run: npm test -w typescript
      - run: npm run build -w typescript
      # okdata (the CLI), built against ../typescript through the workspace
      - run: npm run typecheck -w cli
      - run: npm test -w cli
      - run: npm run build -w cli
      - run: node cli/dist/bin.js --help
      - run: npm pack --dry-run -w typescript -w cli

  python:
    name: python ${{ matrix.python }}
    # Ubuntu 26.04 (ubuntu-latest since 2026-10) has no Python 3.9 build; 24.04 has both versions.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e '.[test]'
      - run: python -m pytest
      # mypy no longer runs on 3.9; the tests above cover 3.9 itself.
      - if: matrix.python == '3.13'
        run: pip install mypy && python -m mypy
      - if: matrix.python == '3.13'
        name: build the sdist and wheel, with the generated code in them and nothing else
        run: |
          pip install build
          python -m build
          python -m zipfile -l dist/*.whl | grep -q 'okdata/_generated/_sync.py'
          extra=$(tar tzf dist/*.tar.gz | grep -vE '^okdata-[^/]+/((src|tests)/.*|README\.md|LICENSE|pyproject\.toml|PKG-INFO|\.gitignore)?$' || true)
          if [ -n "$extra" ]; then echo "unexpected files in the sdist:"; echo "$extra"; exit 1; fi
